<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ANOMALY</title>
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

body::before{
content:"";
position:fixed;
inset:0;

background:
repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(255,255,255,.02) 3px
);

pointer-events:none;
}

.container{
width:min(500px,90%);
padding:35px;
border:1px solid #222;
background:rgba(10,10,10,.9);
backdrop-filter:blur(10px);
}

.logo{
display:flex;
align-items:center;
gap:12px;
margin-bottom:30px;
}

.logo img{
width:45px;
height:45px;
object-fit:contain;
}

.logo h1{
letter-spacing:8px;
font-size:28px;
}

.subtitle{
opacity:.7;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-top:12px;

background:#050505;
border:1px solid #333;
color:white;
}

button{
margin-top:20px;
width:100%;
padding:15px;

background:#111;
border:1px solid #444;
color:white;
cursor:pointer;
}

button:hover{
box-shadow:0 0 20px rgba(255,255,255,.3);
}

#status{
margin-top:20px;
text-align:center;
opacity:.8;
}

.fog{
position:fixed;
inset:0;

background:
radial-gradient(
circle at 30% 40%,
rgba(255,255,255,.04),
transparent 40%
);

animation:fog 15s linear infinite;
pointer-events:none;
}

@keyframes fog{

0%{
transform:translateX(-5%);
}

50%{
transform:translateX(5%);
}

100%{
transform:translateX(-5%);
}

}

</style>
</head>

<body>

<div class="fog"></div>

<div class="container">

<div class="logo">

<img src="logo.png">

<h1>ANOMALY</h1>

</div>

<p class="subtitle">
Transmit your mission evidence.
</p>

<input
id="name"
placeholder="Identify Yourself"
>

<input
id="semester"
placeholder="Semester"
>

<input
id="department"
placeholder="Department"
>

<input
id="karma"
type="number"
placeholder="Task Karma Earned"
>

<input
id="proof"
placeholder="Proof of Work Link"
>

<button onclick="submitMission()">
TRANSMIT TO THE TIMELINE
</button>

<div id="status"></div>

</div>

<script>

async function submitMission(){

const name =
document.getElementById("name").value;

const semester =
document.getElementById("semester").value;

const department =
document.getElementById("department").value;

const karma =
document.getElementById("karma").value;

const proof =
document.getElementById("proof").value;

if(!name || !semester || !department || !karma || !proof){

alert("Complete all fields.");

return;
}

const status =
document.getElementById("status");

status.innerHTML =
"Synchronizing reality...";

const payload = {

name:name,
semester:semester,
department:department,
karma:karma,
proof:proof

};

try{

await fetch(
"",
{
method:"POST",
body:JSON.stringify(payload)
}
);

status.innerHTML =
"✓ TRANSMISSION ACCEPTED";

document.getElementById("name").value="";
document.getElementById("semester").value="";
document.getElementById("department").value="";
document.getElementById("karma").value="";
document.getElementById("proof").value="";

}
catch(err){

status.innerHTML =
"✕ TRANSMISSION FAILED";

}

}

</script>

</body>
</html>
